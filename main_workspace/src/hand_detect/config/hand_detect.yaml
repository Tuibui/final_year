hand_detect:
  ros__parameters:
    # Use HAND_DETECT_RTSP_URL or a private parameter file for credentials.
    rtsp_url: ""
    source_type: "rtsp"   # rtsp, file, or test
    file_uri: ""
    display: true
    inference_enabled: true
    # Generated by setup_model.py; launch supplies the default local path.
    infer_config: ""
    hand_class_id: 2
    confidence_threshold: 0.5
    # Count hands whose bounding-box centers are in the top 50% of the frame.
    roi_top_fraction: 0.5
    width: 640
    height: 480
    rtsp_latency_ms: 100
    stale_timeout_ms: 2000
    max_pipeline_age_ms: 500
    reconnect_delay_ms: 2000
    frame_id: "hikvision_optical_frame"
