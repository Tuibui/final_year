# Hikvision DS-2CD2046G2-I(U) — RTSP display pipeline.
#
# RTSP URL format for Hikvision G2 series:
#   rtsp://<user>:<pass>@<ip>:<rtsp_port>/Streaming/Channels/<channel>
#     channel 101 = camera 1, main stream (full 4 MP)
#     channel 102 = camera 1, sub  stream (lower res, lighter on CPU/network)
#
# Two ways to point the node at the camera:
#   1) Fill in ip_address / username / password below and the node builds the
#      URL for you.
#   2) Or set rtsp_url directly (overrides 1) if your stream path differs.
hikvision_camera:
  ros__parameters:
    # --- TODO: fill these in -------------------------------------------------
    ip_address: "192.168.1.64"          # TODO: camera IP, e.g. "10.88.3.170" (run sadp_discover.py to find it)
    username: "admin"            # TODO: camera login user, e.g. "admin"
    password: "msi@daikim"            # TODO: camera password
    # -------------------------------------------------------------------------
    rtsp_port: 554          # default Hikvision RTSP port
    channel: 101            # 101 = main stream, 102 = sub stream
    rtsp_url: ""            # optional: set full URL to override the fields above

    use_tcp: true           # RTSP over TCP (more reliable than UDP on busy LANs)
    reconnect_delay_s: 2.0  # wait before retrying after a dropped stream
    window_name: "Hikvision DS-2CD2046G2"
    show_fps: true          # overlay measured FPS on the displayed frame
    log_every_n: 4          # log the frame number every Nth frame (4 -> 1,5,9,13,...)
